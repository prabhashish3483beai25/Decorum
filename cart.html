<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - DECORUM</title>
    <link rel="stylesheet" href="stylesheets/global.css">
    <link rel="stylesheet" href="stylesheets/cart.css">

    <!-- Cart logic is handled by js/cart.js -->
</head>

<body>

    <nav>
        <div class="logo">DECORUM</div>
        <ul class="nav-links">
            <li><a href="page1.html">Home</a></li>
            <li><a href="page2.html">Furniture</a></li>
            <li><a href="page3.html">Contact</a></li>
            <li><a href="register.html">Register/Login</a></li>
        </ul>
    </nav>

<div class="container">
    <div class="cart-header">
        <h1>🛒 Your Shopping Cart</h1>
        <p>Review your items before checkout</p>
    </div>

    <div class="cart-content">
        <div id="cartItems" class="cart-items"></div>

        <div id="emptyMessage" class="empty-cart" style="display:none;">
            <h3>Your cart is empty</h3>
            <p>Start shopping to add items to your cart</p>
        </div>

        <div id="cartSummary" class="cart-summary">
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotal">₹0</span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span>Free</span>
            </div>
            <div class="summary-row total">
                <span>Total:</span>
                <span id="totalPrice">₹0</span>
            </div>
        </div>

        <div class="checkout-section">
            <button class="btn btn-continue" onclick="continueShopping()">← Continue Shopping</button>
            <button class="btn btn-checkout" onclick="checkout()">Proceed to Checkout →</button>
        </div>
    </div>
</div>

<!-- Cart logic: load from localStorage, render items, remove, checkout -->
<script src="js/cart.js"></script>
</body>
</html>
