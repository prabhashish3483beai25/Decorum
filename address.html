<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Address - DECORUM</title>
    <link rel="stylesheet" href="stylesheets/global.css">
    <link rel="stylesheet" href="stylesheets/address.css">
</head>

<body>

    <nav>
        <div class="logo">DECORUM</div>
        <ul class="nav-links">
            <li><a href="page1.html">Home</a></li>
            <li><a href="index.html">Catalog</a></li>
            <li><a href="page2.html">Furniture</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="address-wrapper">
            
            <!-- Header -->
            <div class="address-header">
                <h1>📍 Shipping Address</h1>
                <p>Where should we deliver your furniture?</p>
            </div>

            <!-- Progress Indicator -->
            <div class="progress-bar">
                <div class="progress-step active">
                    <span class="step-number">1</span>
                    <span class="step-label">Address</span>
                </div>
                <div class="progress-line"></div>
                <div class="progress-step">
                    <span class="step-number">2</span>
                    <span class="step-label">Payment</span>
                </div>
                <div class="progress-line"></div>
                <div class="progress-step">
                    <span class="step-number">3</span>
                    <span class="step-label">Confirmation</span>
                </div>
            </div>

            <!-- Address Form -->
            <form id="addressForm" class="address-form">
                
                <!-- Full Name -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. Prabhdeep Singh" required>
                    </div>
                </div>

                <!-- Email & Phone -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" required>
                    </div>
                </div>

                <!-- Street Address -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="street">Street Address *</label>
                        <input type="text" id="street" name="street" placeholder="123 Main Street, Apt 4B" required>
                    </div>
                </div>

                <!-- City, State -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City *</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Ambala" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State / Province *</label>
                        <input type="text" id="state" name="state" placeholder="e.g. Haryana" required>
                    </div>
                </div>

                <!-- Country -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="country">Country *</label>
                        <select id="country" name="country" required>
                            <option value="">Select a country</option>
                            <option value="India">India</option>
                            <option value="United States">United States</option>
                            <option value="Canada">Canada</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Australia">Australia</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Pincode Delivery Checker -->
                <div class="form-row pincode-check-row">
                    <div class="form-group">
                        <label for="pincodeInput">📦 Verify Delivery Available</label>
                        <div class="pincode-input-group">
                            <input type="text" id="pincodeInput"
                                   placeholder="Enter 6-digit pincode"
                                   maxlength="6">
                            <button type="button" id="checkBtn" onclick="checkDelivery()">Check</button>
                        </div>
                        <p id="deliveryResult" class="delivery-result"></p>
                    </div>
                </div>

                <!-- Special Instructions -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="instructions">Delivery Instructions (Optional)</label>
                        <textarea id="instructions" name="instructions" 
                            placeholder="e.g. Leave at door, ring doorbell, special access notes..."
                            rows="3"></textarea>
                    </div>
                </div>

                <!-- Checkbox: Same as Billing -->
                <div class="form-row checkbox-row">
                    <div class="form-group">
                        <input type="checkbox" id="sameAsBilling" name="sameAsBilling">
                        <label for="sameAsBilling">Use this address as billing address</label>
                    </div>
                </div>

                <!-- Status Messages -->
                <p id="formStatus" class="form-status"></p>
                <p id="pincodeWarning" class="form-status status-err" style="display:none;">Warning: Please verify your delivery pincode before proceeding</p>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="backToCart()">← Back to Cart</button>
                    <button type="submit" class="btn btn-primary">Continue to Payment →</button>
                </div>

            </form>

        </div>
    </div>

    <!-- Address form logic -->
    <script src="js/address.js"></script>

</body>

</html>
