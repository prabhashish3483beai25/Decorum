<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DECORUM</title>
    <!-- Global styles shared across all pages -->
    <link rel="stylesheet" href="stylesheets/global.css">
    <!-- Login / Register form styles -->
    <link rel="stylesheet" href="stylesheets/login.css">
</head>

<body>

    <nav>
        <div class="logo">DECORUM</div>
        <ul class="nav-links">
            <li><a href="page1.html">Home</a></li>
            <li><a href="page2.html">Furniture</a></li>
            <li><a href="page3.html">Contact</a></li>
            <li><a href="login.html">Register/Login</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="form-header">
            <h1>Welcome Back</h1>
            <p>Login to your DECORUM account</p>
        </div>

        <!-- Login form — submit handled by auth.js → loginForm listener -->
        <form id="loginForm">
            <input type="email"    id="email"    placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password"      required>
            <button type="submit">Login</button>
        </form>

        <div class="form-footer">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>

<!-- Authentication logic shared by login.html and register.html -->
<script src="js/auth.js"></script>

</body>
</html>
